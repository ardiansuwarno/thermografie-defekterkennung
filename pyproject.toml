[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "KIS2_Data",
    "*.ipynb",
]

[tool.ruff.lint]
# E/W = pycodestyle, F = Pyflakes (ungenutzte Imports/Variablen), I = Import-Sortierung
select = ["E", "W", "F", "I"]
ignore = [
    "E402", # Erlaubt sys.path.append vor Imports in src/ML/01_data_preps.py & 04_deploy.py
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"